server {
    listen 80;
    server_name localhost;

    # Thư mục gốc chứa các file build React (dist)
    root /usr/share/nginx/html;
    index index.html index.htm;

    # ==========================================
    # 1. BẬT NÉN GZIP (Hút chân không dữ liệu)
    # ==========================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # ==========================================
    # 2. XỬ LÝ LỖI 404 CHO REACT ROUTER (SPA)
    # ==========================================
    location / {
        # Nếu có file tĩnh thì trả về, nếu KHÔNG CÓ thì đẩy về index.html cho React Router xử lý!
        try_files $uri $uri/ /index.html;
    }

    # ==========================================
    # 3. TỐI ƯU CACHE TRÌNH DUYỆT CHO ASSETS
    # ==========================================
    # Các file ảnh, font, css, js lưu cache 1 năm để tải trang siêu tốc
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ==========================================
    # 4. BẢO MẬT HEADERS CHUẨN SENIOR
    # ==========================================
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # Chặn không cho người ngoài xem file ẩn (.git, .env)
    location ~ /\. {
        deny all;
    }
}