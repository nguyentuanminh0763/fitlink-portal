# Azure DevOps CI/CD Pipeline for FitLink Frontend (Portal)
trigger:
  # Agent tự host chỉ chạy 1 job mỗi lúc: push liên tiếp thì gom thành 1 lần chạy cho bản mới nhất
  batch: true
  branches:
    include:
      - main
      - dev
  # Push chỉ sửa tài liệu thì không chạy CI (có lẫn file code thì vẫn chạy)
  paths:
    exclude:
      - '*.md'
      - '**/*.md'

pr:
  branches:
    include:
      - main
      - dev
  paths:
    exclude:
      - '*.md'
      - '**/*.md'

pool:
  name: 'Default'


steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: '1. Setup Node.js 20'

- script: |
    npm ci
  displayName: '2. Install Clean Dependencies (npm ci)'

- script: |
    npm run build
  displayName: '3. Verify Vite Production Build'

- task: Docker@2
  displayName: '4. Build and Push to Azure Container Registry (CD)'
  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
  inputs:
    containerRegistry: 'fitlinkacr-sc'
    repository: 'fitlink-portal'
    command: 'buildAndPush'
    Dockerfile: '**/Dockerfile'
    tags: |
      $(Build.BuildId)
      latest

- powershell: |
    docker info > $null 2>&1
    if ($LASTEXITCODE -eq 0) {
        Write-Host "Verifying Docker build for PR..."
        docker build -t fitlink-portal:ci-test .
        if ($LASTEXITCODE -ne 0) { exit 1 }
    }
  condition: eq(variables['Build.Reason'], 'PullRequest')
  displayName: '4. Verify Multi-Stage Dockerfile Build (PR Validation Only)'

