# Azure DevOps CI/CD Pipeline for FitLink Frontend (Portal)
trigger:
  branches:
    include:
      - main
      - dev

pr:
  branches:
    include:
      - main
      - dev

pool:
  name: 'Default'

# Senior Standard: Decouple configuration from pipeline logic via variables
# Values defined here act as defaults, fully overridable via Azure DevOps Library / Pipeline UI
variables:
  VITE_API_URL: 'https://fitlink-api.thankfulpond-53ca2df8.southeastasia.azurecontainerapps.io'
  VITE_API_BASE_URL: 'https://fitlink-api.thankfulpond-53ca2df8.southeastasia.azurecontainerapps.io/api'
  VITE_SOCKET_URL: 'https://fitlink-api.thankfulpond-53ca2df8.southeastasia.azurecontainerapps.io'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: '1. Setup Node.js 20'

- script: |
    npm ci
  displayName: '2. Install Clean Dependencies (npm ci)'

- script: |
    npm run build
  displayName: '3. Verify Vite Production Build'

- task: Docker@2
  displayName: '4. Build and Push to Azure Container Registry (CD)'
  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
  inputs:
    containerRegistry: 'fitlinkacr-sc'
    repository: 'fitlink-portal'
    command: 'buildAndPush'
    Dockerfile: '**/Dockerfile'
    arguments: '--build-arg VITE_API_URL=$(VITE_API_URL) --build-arg VITE_API_BASE_URL=$(VITE_API_BASE_URL) --build-arg VITE_SOCKET_URL=$(VITE_SOCKET_URL)'
    tags: |
      $(Build.BuildId)
      latest

- powershell: |
    docker info > $null 2>&1
    if ($LASTEXITCODE -eq 0) {
        Write-Host "Verifying Docker build for PR..."
        docker build -t fitlink-portal:ci-test .
        if ($LASTEXITCODE -ne 0) { exit 1 }
    }
  condition: eq(variables['Build.Reason'], 'PullRequest')
  displayName: '4. Verify Multi-Stage Dockerfile Build (PR Validation Only)'
