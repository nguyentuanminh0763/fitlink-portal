# Azure DevOps CI/CD Pipeline for FitLink Frontend (Portal)
trigger:
  # Agent tự host chỉ chạy 1 job mỗi lúc: push liên tiếp thì gom thành 1 lần chạy cho bản mới nhất
  batch: true
  branches:
    include:
      - main
      - dev
  # Push chỉ sửa tài liệu thì không chạy CI (có lẫn file code thì vẫn chạy)
  paths:
    exclude:
      - '*.md'
      - '**/*.md'

pr:
  branches:
    include:
      - main
      - dev
  paths:
    exclude:
      - '*.md'
      - '**/*.md'

pool:
  name: 'Default'


# Không chạy npm ci + npm run build trên agent: Dockerfile đã chạy đúng hai lệnh đó ở stage builder,
# build hỏng thì bước Docker đỏ. Làm hai lần chỉ tốn thêm ~2 phút mỗi lần chạy.
steps:
- task: Docker@2
  displayName: '1. Build and Push to Azure Container Registry (CD)'
  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
  inputs:
    containerRegistry: 'fitlinkacr-sc'
    repository: 'fitlink-portal'
    command: 'buildAndPush'
    Dockerfile: '**/Dockerfile'
    tags: |
      $(Build.BuildId)
      latest

# Docker không chạy thì bước này phải ĐỎ: đây là chỗ duy nhất kiểm tra build của PR.
- powershell: |
    docker build -t fitlink-portal:ci-test .
    if ($LASTEXITCODE -ne 0) { exit 1 }
  condition: eq(variables['Build.Reason'], 'PullRequest')
  displayName: '1. Verify Multi-Stage Dockerfile Build (PR Validation Only)'

